</style></head><body><main class="wrap"><a class="back" href="index.html#work">← 返回项目列表</a><nav class="project-nav" id="projectNav" aria-label="项目详情导航"></nav><p id="category" class="eyebrow"></p><h1 id="title"></h1><p id="summary" class="summary"></p><div class="facts"><div><b>项目时间</b><span id="date"></span></div><div><b>我的职责</b><span id="role"></span></div><div><b>项目成果</b><span id="result"></span></div></div><img id="image" class="hero-img" alt="项目界面展示"><video id="heroVideo" class="hero-video" muted loop playsinline controls></video><section class="content"><h2>01 项目背景</h2><div><h3>问题与目标</h3><p id="background"></p><p id="constraints"></p></div></section><section class="content"><h2>02 研究判断</h2><div><h3>我如何理解问题</h3><p id="research"></p><ul id="insights"></ul></div></section><section class="content"><h2>03 核心流程</h2><div><h3>从进入到完成任务</h3><ol id="flow"></ol></div></section><section class="content"><h2>04 关键设计</h2><div><h3>影响方案的设计决策</h3><ul id="design"></ul></div></section><div id="story" class="story"></div><section class="content"><h2>05 结果与反思</h2><div class="decision"><p id="outcome"></p><p id="reflection"></p></div></section><p class="site-note">页面内容来自作品集原始信息；展示图与视频优先使用作品集文件中可单独提取的原始素材，不直接使用整页 PPT 截图。</p><div class="next"><a href="index.html#work">返回全部项目</a><a href="mailto:liyuting2018@126.com">联系我 ↗</a></div></main><script>
const projects={
camera:{category:'AI EXPERIENCE DESIGN',title:'多模态 AI 相机',summary:'让用户不必理解专业参数，也能在取景当下获得自然、及时的创作引导。',date:'2025.02 — 2026.03',role:'UX 设计、体验架构、多模态交互、原型演示与专利总结',result:'部分体验落地 HUAWEI Pura 90；参与 4 项国家发明专利申请',image:'case-camera.png',background:'移动摄影中，用户常在复杂参数调校与错失最佳瞬间之间权衡。项目希望通过 AI 降低专业摄影门槛，同时保持相机界面的低干扰和即时性。',constraints:'核心约束是：AI 推理复杂、拍摄时间短、取景画面不能被大量信息遮挡，而且用户需要随时忽略或退出推荐。',research:'我对专业摄影工具、原生相机和 AI 修图产品进行了比较，重点观察推荐出现的时机、视觉反馈和用户控制方式。',insights:['用户在拍摄时不适合阅读复杂说明，需要直接感知下一步动作。','AI 推荐必须说明方向，但不能夺走用户的拍摄控制权。','引导应随场景变化，并在完成后立即提供明确反馈。'],flow:['识别当前场景与主体','提供构图或姿势建议','通过动态线条引导移动与取景','确认机位完成并预览变焦','用户拍摄或忽略推荐'],design:['使用轻量动态线条表达移动方向，减少文字说明。','加入机位完成反馈，让用户知道系统已经理解当前状态。','通过变焦预览降低自动变焦带来的不确定感。','个性色卡支持提取影调、实时预览和二次调整。'],outcome:'部分交互体验已在 HUAWEI Pura 90 落地，并形成灵感推荐、AI 助手触发和 AI 美学抓拍等相关专利申请。',reflection:'色卡模式的退出方式仍不够直觉。后续需要统一入口、退出和状态恢复规则，减少用户的学习成本。'},
expression:{category:'AI EXPERIENCE DESIGN',title:'魔法表情',summary:'把人脸驱动技术变成像拍照一样直觉的表情编辑体验。',date:'2024.11 — 2025.05',role:'UIUX 设计、实时预览流程、单手操作与视觉反馈',result:'部分体验落地 HUAWEI Mate 80',image:'case-expression.png',background:'合影与自拍中经常出现眨眼、僵硬或表情不佳，传统修图步骤复杂，也容易产生不自然的结果。',constraints:'方案既要让用户实时看到真实表情，又要控制算法处理范围和设备性能压力。',research:'我结合用户修图习惯与 AIGC 工具，寻找既有趣又可控的实时编辑方式。',insights:['用户希望在生成前看到效果，而不是等待一次不可控的结果。','沿用熟悉的拍照操作可以降低新技术的学习成本。','视觉聚焦同时可以帮助用户理解当前处理范围。'],flow:['选择需要调整的人脸','查看并驱动目标表情','实时确认效果','在快门位置执行替换','保存或重新尝试'],design:['虚化面部以外区域，让用户聚焦处理对象并减轻算法压力。','把替换按钮放在相机快门位置，支持单手操作。','持续显示真实表情，帮助用户理解输入与结果的关系。'],outcome:'核心体验部分落地于 HUAWEI Mate 80，将表情修正从传统参数编辑转化为实时、可感知的操作。',reflection:'后续验证应继续关注实时响应速度、生成真实感以及用户对保存状态的理解。'},
retouch:{category:'AI EXPERIENCE DESIGN',title:'小艺修图',summary:'通过圈选、语音和文字，让用户更准确地表达修图意图并控制生成过程。',date:'2025.08 — 2026.02',role:'UX 设计、多模态输入、对话修图、历史记录与推荐流',result:'核心体验集成于 HUAWEI Nova 16 与鸿蒙小艺修图',image:'case-retouch.png',background:'传统修图依赖复杂参数，而自然语言虽然简单，却存在表达模糊和结果不确定的问题。',constraints:'用户必须能明确指出对象、表达意图、理解处理状态，并在结果不满意时继续调整或返回。',research:'我研究 AIGC 编辑工具和用户表达习惯，把语言模糊性与结果确定性作为主要体验矛盾。',insights:['圈选负责确定对象，语言负责描述变化，两者组合更准确。','生成过程必须保留历史，避免用户失去满意的中间结果。','推荐应该帮助用户继续表达，而不是代替用户作决定。'],flow:['从图库进入修图','圈选需要修改的对象','通过语音或文字表达意图','查看生成状态与结果','使用推荐继续优化','回看或恢复历史版本'],design:['在浏览照片时提供直接入口，缩短任务路径。','统一圈选、语音与文字三种输入方式。','按步骤排列历史修图记录，保留可回退路径。','在结果旁展示相关优化建议，支持连续创作。'],outcome:'核心交互作为技术方案落地，并集成于 Nova 16 及鸿蒙小艺修图功能。',reflection:'后续可以进一步验证不同表达方式的成功率，并完善理解错误、生成失败和长时间等待的反馈。'},
sider:{category:'MAC CLIENT DESIGN',title:'Sider GPT',summary:'主要负责 Sider Mac 客户端设计，围绕 AI 聊天体验推进界面迭代与设计规范整理。',date:'2023.03 — 2023.11',role:'Mac 客户端 UIUX 设计、设计规范与商店展示图',result:'Mac 客户端界面迭代、设计规范与多语言商店素材',image:'case-sider.png',background:'Sider 的产品生态包含 Chrome 插件与桌面客户端。本项目呈现的是我在 2023 年参与的 Mac 客户端设计工作，重点围绕桌面端 AI 聊天体验展开。',constraints:'Mac 客户端需要组织聊天、侧边栏、登录、账户、文本工具、升级和反馈等界面，并考虑多语言内容的呈现。',research:'设计关注点是 AI 聊天入口、Prompt 输入和桌面端功能组织；现有材料未提供用户访谈样本或可用性测试数据。',insights:['侧边栏用于组织聊天和功能入口。','文本工具与划词工具用于扩展桌面端使用场景。','设计规范用于支持客户端的持续迭代。'],flow:['登录客户端','进入 AI 聊天','通过侧边栏切换功能','使用文本或划词工具','管理账户、升级或提交反馈'],design:['完成 Mac 客户端相关界面设计与迭代。','梳理聊天、侧边栏与账户等界面的信息组织。','整理组件与样式规范。','制作多语言商店展示素材。'],outcome:'项目交付围绕 Mac 客户端界面、设计规范与多语言商店展示素材展开。',reflection:'产品后续发展：Chrome 插件及跨平台产品在项目结束多年后的公开规模，仅作为产品生态背景，不代表 2023 年的项目成果，也不能归因于我当年的设计工作。'},
awesome:{category:'WEB & COMMERCIAL EXPERIENCE',title:'Awesome Screenshot',summary:'用信息架构和页面体系重新解释一个跨平台截屏录屏产品。',date:'2022.12 — 2023.03',role:'Web 设计、竞品研究、信息架构与页面体系',result:'新增 20+ 页面、7 个模块；SEO 内容获得 10 万+阅读量',image:'case-awesome.png',background:'产品覆盖截屏、录屏和在线工作区，但旧官网内容不足，无法完整解释产品能力，也缺少清晰的帮助和售后入口。',constraints:'网站既要支持新用户理解产品，也要服务购买、问题解决、隐私说明和长期 SEO 内容。',research:'我与产品经理完成竞品调研，梳理不同用户进入官网后的主要任务与内容需求。',insights:['首页需要同时解释截屏、录屏与在线工作区。','产品场景比单纯功能罗列更容易帮助用户理解价值。','帮助中心和博客既服务现有用户，也承担搜索入口。'],flow:['从首页理解产品能力','按使用场景了解功能','比较购买方案','进入帮助中心解决问题','通过博客或反馈继续获取支持'],design:['建立产品介绍、使用场景、购买方案和帮助内容的完整层级。','统一 20+ 页面之间的视觉语言与导航关系。','通过场景页帮助不同角色找到相关功能。','为 SEO 博客建立可持续扩展的内容入口。'],outcome:'官网增加 7 个模块和 20+ 页面，SEO 分区文章获得 10 万+深度阅读量。',reflection:'后续可补充页面转化路径、关键 CTA 点击或帮助内容的搜索数据，更直接证明设计影响。'},

<a class="back" href="index.html#work">← 返回项目列表</a><p class="eyebrow">MAC CLIENT DESIGN</p><h1>Sider GPT</h1><p class="summary">围绕 Mac 客户端 AI 聊天体验，推进界面迭代、功能组织与设计规范。</p>
<div class="facts"><div><b>项目时间</b><span>2023.03 — 2023.11</span></div><div><b>我的职责</b><span>Mac 客户端 UIUX 设计、界面迭代与官网设计</span></div><div><b>项目成果</b><span>完成客户端主要界面、组件规范及官网设计</span></div></div>
<div class="sider-cover"><img id="siderCover" src="case-sider-light.png" alt="Sider GPT 亮色界面"></div><div class="sider-switch" role="group" aria-label="切换 Sider 界面主题"><button type="button" class="on" data-mode="light" aria-pressed="true">☀ 亮色</button><button type="button" data-mode="dark" aria-pressed="false">☾ 暗色</button></div>
<section class="camera-section"><p class="eyebrow">01 项目背景</p><div class="camera-copy"><h2>问题与目标</h2><p>Sider 从浏览器插件延伸到 Mac 客户端，需要让聊天、账户、桌面工具与官网形成清晰一致的产品体验。</p><p>设计重点是让用户既能沉浸对话，也能在工作场景中快速调用 AI 能力，并通过可复用的组件支持持续迭代。</p></div></section>
<section class="camera-section"><p class="eyebrow">02 研究判断</p><div class="camera-copy"><h2>以场景区分三种入口</h2><p>聊天窗口承载沉浸式信息流；侧边栏承担常驻工作助手；悬浮工具栏提供选中文本后的快捷操作。三种入口各有侧重，共同组成高效协同的桌面办公体验。</p></div><div class="sider-scenarios"><figure><img src="sider-assets/final.png" alt="Sider 正式版聊天窗口"><figcaption>聊天窗口 · 沉浸式对话</figcaption></figure><figure><img src="sider-assets/sidebar.png" alt="Sider 常驻侧边栏"><figcaption>Sidebar · 工作助手</figcaption></figure><figure><img src="sider-assets/toolbar.png" alt="Sider 悬浮工具栏"><figcaption>Toolbar · 快捷工具</figcaption></figure></div></section>
<section class="camera-section"><p class="eyebrow">03 核心流程</p><div class="camera-copy"><h2>让具体界面跟随使用路径展开</h2></div><div class="sider-flow">
<div class="sider-flow-step"><div class="step-heading"><h3>从首次进入到可用状态</h3><p>登录、创建初始助手与账户状态沿用一致的视觉语言，让用户从初次使用自然进入日常使用。</p></div><div class="sider-flow-images"><img src="project-assets/image85.png" alt="Sider 登录欢迎页"><img src="project-assets/image86.png" alt="创建初始助手"></div><p class="sider-flow-caption">进入与账户 · 登录欢迎页 / 创建初始助手</p></div>
<div class="sider-flow-step"><div class="step-heading"><h3>对话与角色发现</h3><p>主界面组织会话列表、对话内容和输入区域；角色发现为不同 Bot 提供浏览入口，并在明暗主题下保持信息层级一致。</p></div><div class="sider-flow-images"><img src="project-assets/image73.png" alt="AI 聊天亮色界面"><img src="project-assets/image74.png" alt="AI 聊天暗色界面"><img src="project-assets/image75.png" alt="角色发现亮色界面"><img src="project-assets/image76.png" alt="角色发现暗色界面"></div><p class="sider-flow-caption">AI 聊天 · 对话与角色发现的明暗主题</p></div>
<div class="sider-flow-step"><div class="step-heading"><h3>在文本场景中快捷调用 AI</h3><p>翻译、总结、改写等工具从选中文本的场景切入；完成快捷操作后，仍可进入聊天继续处理。</p></div><div class="sider-flow-images three"><img src="project-assets/image91.png" alt="翻译工具"><img src="project-assets/image92.png" alt="文本处理结果"><img src="project-assets/image93.png" alt="划词工具菜单"></div><p class="sider-flow-caption">桌面工具 · 翻译 / 文本处理 / 划词菜单</p></div>
<div class="sider-flow-step"><div class="step-heading"><h3>把产品能力串成连续叙事</h3><p>官网长页结合功能介绍、界面示例与购买信息，帮助访问者沿页面逐步理解产品。</p></div><div class="sider-browser" aria-label="Sider 官网长图自动滚动预览"><div class="sider-browser-bar" aria-hidden="true"><i></i><i></i><i></i><span></span></div><div class="sider-browser-view" id="siderBrowser"><img src="project-assets/image98.png" alt="Sider 官网设计长图"></div></div><p class="sider-flow-caption">官网设计 · 自动滚动预览，也可手动滚动</p></div>
<div class="sider-flow-step sider-spec"><div class="step-heading"><h3>组件与样式规范</h3><p>将主要控件、输入状态和反馈样式整理为可复用规范。按住下方大图拖动查看细节，也可以使用滚轮或触控板滚动。</p></div><div class="sider-pan" id="siderPan" aria-label="可拖动查看的 Sider 组件规范大图" tabindex="0"><img src="sider-assets/components.png" alt="Sider 组件与样式规范完整图"></div><p class="sider-flow-caption">组件规范 · 拖动查看大图细节</p></div>
</div></section>
<section class="camera-section"><p class="eyebrow">04 关键设计</p><div class="camera-copy"><h2>聊天界面的三次取舍</h2><p>从对话优先的概念版，到集中承载更多功能的复杂版，再到减轻信息负担的正式版，逐步厘清主任务与辅助能力的层级。</p></div><div class="sider-timeline">
<article class="sider-phase"><div class="sider-phase-head"><div><small>V1 · 聊天概念</small><h3>先建立对话主线</h3></div><p>以会话列表、聊天内容和输入框搭出最直接的桌面对话结构。此时功能入口较少，重点是验证主任务的阅读与输入关系。</p></div><img src="sider-assets/concept.png" alt="Sider 早期聊天概念界面"></article>
<article class="sider-phase"><div class="sider-phase-head"><div><small>V2 · 功能扩展</small><h3>把能力集中接入</h3></div><p>加入角色、历史记录和更多功能导航，使工作所需能力更容易被找到；与此同时，侧边与右侧信息同时增多，聊天空间受到挤压。</p></div><img src="sider-assets/expanded.png" alt="Sider 搭载更多功能的复杂版聊天界面"></article>
<article class="sider-phase"><div class="sider-phase-head"><div><small>V3 · 减负正式版</small><h3>把对话重新放回中心</h3></div><p>收拢高频入口，降低同时呈现的信息量，让对话与输入保持视觉中心；辅助能力保留可达性，但不持续占用注意力。</p></div><img src="sider-assets/final.png" alt="Sider 减负后的正式版聊天界面"></article>
</div></section>
<section class="camera-section sider-future"><p class="eyebrow">05 后续优化方向</p><div class="camera-copy"><h2>让工作流更连贯</h2><p>后续可继续梳理聊天、侧边栏与悬浮工具栏之间的任务衔接，减少重复入口，并统一跨界面的状态与反馈。</p></div></section>
